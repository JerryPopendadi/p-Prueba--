<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa Horizonte</title>
<meta name="description" content="Casa Horizonte — villa mediterránea contemporánea. Proyecto conceptual con recorrido inmersivo, plantas, zonificación y ficha técnica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..900&family=Instrument+Serif:ital@1&family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#0b0b0c; --muted:#6e6e73; --line:#e6e6e9; --soft:#f5f5f3;
  --blue:#3a4fd8; --blue-soft:#b9c4ff;
  --z-soc:#dfe5ff; --z-pri:#f1e6d6; --z-ser:#e9e9ec; --z-cir:#f4f4f1; --z-ext:#e4eedf; --z-agua:#d3e9f1; --z-vac:#ffffff;
  --sans:"Inter Tight",system-ui,sans-serif;
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --pad:clamp(16px,3.2vw,48px); --hh:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;text-transform:none}

/* Cabecera */
.nav{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:30;display:flex;align-items:center;gap:20px;padding:0 var(--pad);background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background .3s,border-color .3s}
.nav .malbo{width:96px;color:var(--ink)}
.brand{display:flex;align-items:center;gap:16px}
.brand .pname{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding-left:16px;border-left:1px solid currentColor;opacity:.75}
.links{margin-left:auto;display:flex;gap:2px}
.links a{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:8px 11px;border-radius:999px;color:var(--muted);transition:.25s}
.links a:hover{color:var(--ink);background:#f1f1f3}
.lang{display:flex;gap:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em}
.lang button{border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:7px 8px;border-radius:999px}
.lang button.on{color:#fff;background:var(--ink)}
.cta{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap;transition:.25s}
.cta:hover{background:var(--blue)}
.nav.dark{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent;color:#fff}
.nav.dark .malbo{color:#fff}
.nav.dark .links a{color:rgba(255,255,255,.78)}
.nav.dark .links a:hover{background:rgba(255,255,255,.12);color:#fff}
.nav.dark .lang button{color:rgba(255,255,255,.7)}
.nav.dark .lang button.on{background:#fff;color:var(--ink)}
.nav.dark .cta{background:#fff;color:var(--ink)}

/* Recorrido */
.stage{position:fixed;inset:0;z-index:1}
.card{position:absolute;inset:0;background:#1a1a1a;overflow:hidden}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.16) 42%,transparent 60%),linear-gradient(to bottom,rgba(0,0,0,.36),transparent 22%)}
.chap{position:absolute;left:var(--pad);bottom:calc(var(--pad) + 18px);width:min(900px,calc(100% - 2 * var(--pad)));color:#fff;opacity:0;will-change:transform,opacity,filter;text-shadow:0 8px 40px rgba(0,0,0,.25)}
.chap .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.chap .kicker::before{content:"";width:28px;height:1px;background:currentColor}
.chap h2,.chap h1{font-weight:800;font-size:clamp(46px,6.4vw,112px);line-height:.88;letter-spacing:-.045em;text-transform:uppercase}
.chap h1{font-size:clamp(44px,5.6vw,100px)}
.chap em{color:var(--blue-soft);font-size:1.04em}
.chap p.body{margin-top:18px;max-width:440px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.9)}
.scroll{display:flex;align-items:center;gap:12px;margin-top:28px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.scroll span{display:block;width:22px;height:34px;border:1.5px solid #fff;border-radius:12px;position:relative}
.scroll span::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.ring{position:absolute;right:calc(var(--pad) + 8px);top:50%;width:70px;height:70px;margin-top:-35px;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.btns{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:14px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);transition:.25s;text-shadow:none}
.btn.solid{background:#fff;color:var(--ink);border-color:#fff}
.btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
#scrolly{position:relative;height:2200vh;z-index:0}

#loader{position:fixed;inset:0;z-index:60;background:#fff;display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader .malbo{width:150px}
#loader .bar2{width:150px;height:2px;background:var(--line);margin-top:22px;overflow:hidden;border-radius:2px}
#loader .bar2 i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}

/* Secciones */
.after{position:relative;z-index:10;background:#fff}
.sec{padding:clamp(80px,11vw,150px) var(--pad) 0}
.head{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);align-items:end;border-top:1px solid var(--ink);padding-top:22px}
.sk{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.h2{font-weight:800;font-size:clamp(36px,5vw,80px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase}
.h2 em{color:var(--blue)}
.lede{font-size:16px;line-height:1.65;color:var(--muted);max-width:560px}
.lede+.lede{margin-top:16px}
.figs{display:grid;grid-template-columns:repeat(6,1fr);margin-top:clamp(50px,7vw,90px);border-top:1px solid var(--line)}
.figs div{padding:22px 16px 0 0;border-right:1px solid var(--line);margin-right:16px}
.figs div:last-child{border-right:0}
.figs span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.figs b{display:block;margin-top:10px;font-weight:800;font-size:clamp(28px,3.4vw,52px);letter-spacing:-.045em;line-height:1}
.figs b small{font-size:.42em;letter-spacing:0;margin-left:4px;color:var(--muted);font-weight:500}

/* Galería */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:clamp(40px,6vw,70px)}
.gal figure{position:relative;overflow:hidden;cursor:zoom-in;background:var(--soft)}
.gal figure img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.gal figure:hover img{transform:scale(1.03)}
.gal figcaption{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.g1{grid-column:span 4;aspect-ratio:16/9.6}.g2{grid-column:span 2}.g3{grid-column:span 6;aspect-ratio:21/9}
.g4,.g5{grid-column:span 3;aspect-ratio:16/10}.g6{grid-column:span 4;aspect-ratio:16/10}.g7{grid-column:span 2}
.g8,.g9{grid-column:span 3;aspect-ratio:16/10}
#lb{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.94);display:none;place-items:center;padding:var(--pad);cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-height:88vh;max-width:100%;object-fit:contain}
#lb p{position:absolute;left:var(--pad);bottom:var(--pad);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff}

/* Plantas */
.plans{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,4vw,64px);margin-top:clamp(40px,6vw,70px);align-items:start}
.plan-wrap{border:1px solid var(--line);background:#fff;position:relative}
.plan-wrap svg{display:block;width:100%;height:auto}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{border:0;background:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}
.switch{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;user-select:none;border:0;background:none;color:var(--ink);padding:8px 4px}
.switch i{width:38px;height:22px;border-radius:999px;background:#d9d9de;position:relative;transition:.25s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
.switch[aria-pressed="true"] i{background:var(--blue)}
.switch[aria-pressed="true"] i::after{left:19px}
.info{margin-top:22px;min-height:74px;border-top:1px solid var(--ink);padding-top:16px}
.info b{display:block;font-weight:800;font-size:28px;letter-spacing:-.03em;text-transform:uppercase}
.info span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--blue)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:20px}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink);text-align:left;padding:6px 0}
.legend i{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:none}
.legend small{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px}
.table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:0 0 8px;border-bottom:1px solid var(--ink)}
.table td{padding:8px 0;border-bottom:1px solid var(--line)}
.table td:last-child,.table th:last-child{text-align:right;font-family:var(--mono);font-size:12px}
.table tr{cursor:pointer}
.table tr.hl td{color:var(--blue)}
.table tr.tot td{font-weight:700;border-bottom:1px solid var(--ink)}
.table .dot{display:inline-block;width:9px;height:9px;margin-right:9px;border:1px solid rgba(0,0,0,.25);vertical-align:middle}
.rm rect{fill:#fff;stroke:var(--ink);stroke-width:1;transition:fill .25s,opacity .25s;cursor:pointer}
.zoning .rm rect{fill:var(--zc)}
.rm.ext rect{fill:url(#hx)}
.rm.agua rect{fill:#eef6fa}
.zoning .rm.ext rect{fill:var(--z-ext)}
.zoning .rm.agua rect{fill:var(--z-agua)}
.rm.vac rect{fill:url(#hv)}
.rm text{font:600 10.5px var(--sans);fill:var(--ink);text-anchor:middle;pointer-events:none;text-transform:uppercase;letter-spacing:.03em}
.rm text.m{font:400 9.5px var(--mono);fill:var(--muted);text-transform:none;letter-spacing:0}
.rm:hover rect,.rm.on rect{fill:var(--blue) !important;opacity:.85}
.rm:hover text,.rm.on text{fill:#fff}
.dim .rm:not(.on) rect{opacity:.28}
.wall{fill:none;stroke:var(--ink);stroke-width:4;pointer-events:none}
.ghost{fill:none;stroke:#9a9aa2;stroke-width:1;stroke-dasharray:5 4;pointer-events:none}
.ghost-t{font:500 9px var(--mono);fill:#9a9aa2;letter-spacing:.08em;text-transform:uppercase}
.glz{stroke:var(--blue);stroke-width:4;pointer-events:none}
.anno{font:500 9px var(--mono);fill:var(--ink);letter-spacing:.1em}

/* Estrategia */
.strat{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(40px,6vw,70px);border-top:1px solid var(--line)}
.strat article{padding:26px 26px 30px 0;border-bottom:1px solid var(--line)}
.strat article:not(:nth-child(3n)){border-right:1px solid var(--line);margin-right:26px}
.strat b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--blue)}
.strat h4{font-weight:800;font-size:21px;letter-spacing:-.03em;text-transform:uppercase;margin:12px 0 8px}
.strat p{font-size:14.5px;line-height:1.55;color:var(--muted)}

/* Materiales */
.mats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:clamp(40px,6vw,70px)}
.mats img{aspect-ratio:1;object-fit:cover;width:100%}
.mats h4{font-weight:800;font-size:18px;letter-spacing:-.02em;text-transform:uppercase;margin:16px 0 6px}
.mats p{font-size:14px;line-height:1.5;color:var(--muted)}

/* Proceso */
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:clamp(40px,6vw,70px);counter-reset:f}
.proc img{aspect-ratio:4/5;object-fit:cover;width:100%}
.proc .bar{height:3px;background:var(--line);margin-top:16px;position:relative}
.proc .bar i{position:absolute;top:0;height:100%;background:var(--ink)}
.proc b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--blue);margin-top:14px}
.proc h4{font-weight:800;font-size:18px;letter-spacing:-.02em;text-transform:uppercase;margin:8px 0 4px}
.proc p{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.note{margin-top:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}

/* Ficha */
.specs{margin-top:clamp(40px,6vw,70px);display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(24px,5vw,80px)}
.specs div{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.specs dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.specs dd{font-size:15px;line-height:1.45}

/* Profesionales + contacto */
.pros{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:clamp(40px,6vw,70px)}
.pros article{border:1px solid var(--line);padding:28px}
.pros h4{font-weight:800;font-size:22px;letter-spacing:-.03em;text-transform:uppercase;margin-bottom:10px}
.pros p{font-size:14.5px;line-height:1.55;color:var(--muted)}
.dossier{margin-top:16px;background:var(--ink);color:#fff;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.dossier span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-soft)}
.dossier p{font-size:16px}
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,80px);align-items:end;padding-bottom:clamp(80px,10vw,140px)}
.contact form{display:grid;gap:10px}
.contact input,.contact select,.contact textarea{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:14px 0;outline:none;border-radius:0}
.contact textarea{resize:vertical;min-height:70px}
.contact input:focus,.contact select:focus,.contact textarea:focus{border-color:var(--ink)}
.contact button{justify-self:start;margin-top:16px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;border-radius:999px;border:0;background:var(--ink);color:#fff;transition:.25s}
.contact button:hover{background:var(--blue)}
footer{padding:28px var(--pad);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
footer .malbo{width:90px;color:var(--ink)}

@media (max-width:980px){
  .links{display:none}
  .lang{margin-left:auto}
  .plans{grid-template-columns:1fr}
  .figs{grid-template-columns:repeat(3,1fr);row-gap:24px}
  .figs div:nth-child(3){border-right:0}
  .strat{grid-template-columns:1fr 1fr}
  .strat article:not(:nth-child(3n)){border-right:0;margin-right:0}
  .strat article:nth-child(odd){border-right:1px solid var(--line);margin-right:20px}
  .mats,.proc{grid-template-columns:1fr 1fr}
  .specs{grid-template-columns:1fr}
  .pros{grid-template-columns:1fr}
}
@media (max-width:700px){
  :root{--hh:60px}
  .brand .pname{display:none}
  .nav .malbo{width:80px}
  .cta{padding:10px 14px;font-size:9.5px}
  .head{grid-template-columns:1fr}
  .chap{bottom:28px}
  .chap h2{font-size:clamp(38px,11.5vw,66px)}
  .chap h1{font-size:clamp(38px,11vw,64px)}
  .chap p.body{font-size:14px;margin-top:14px}
  .ring{display:none}
  .gal{grid-template-columns:1fr 1fr}
  .gal figure{grid-column:span 2 !important;aspect-ratio:16/10 !important}
  .strat{grid-template-columns:1fr}
  .strat article:nth-child(odd){border-right:0;margin-right:0}
  .specs div{grid-template-columns:1fr;gap:4px}
  .contact{grid-template-columns:1fr}
  .rm text{font-size:15px}
  .rm text.m{font-size:13px}
  .legend{grid-template-columns:1fr}
}
@media (max-width:400px){.cta{display:none}}
@media (prefers-reduced-motion:reduce){.scroll span::after{animation:none}}
</style>
</head>
<body>

<template id="logoTpl">
<svg class="malbo" viewBox="0 0 600 168" role="img" aria-label="MALBO Innovation">
  <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="currentColor"/><stop offset=".5" stop-color="currentColor"/><stop offset="1" stop-color="#8ea2ff"/></linearGradient></defs>
  <g fill="none" stroke="currentColor" stroke-width="17" stroke-linejoin="miter">
    <path d="M8 120V14l50 50" stroke="url(#mg)"/><path d="M58 64l50-50v106"/>
    <path d="M138 120l52-106 52 106"/>
    <path d="M275 10v104h66"/>
    <path d="M372 120V14h44a25 25 0 0 1 0 50h-44m44 0h4a28 28 0 0 1 0 56h-48"/>
    <circle cx="530" cy="67" r="52"/>
  </g>
  <path d="M500 67l70-3 26 3-26 3z" fill="currentColor"/>
  <text x="300" y="162" text-anchor="middle" fill="currentColor" font-family="Inter Tight,sans-serif" font-size="24" letter-spacing="26">INNOVATION</text>
</svg>
</template>

<div id="loader"><div><div data-logo></div><div class="bar2"><i id="loadBar"></i></div></div></div>

<header class="nav" id="nav">
  <a class="brand" href="#" data-go="0"><span data-logo></span><span class="pname">Casa Horizonte</span></a>
  <nav class="links">
    <a href="#proyecto" data-t="nProj"></a>
    <a href="#galeria" data-t="nGal"></a>
    <a href="#plantas" data-t="nPlans"></a>
    <a href="#ficha" data-t="nSpecs"></a>
    <a href="#proceso" data-t="nProc"></a>
  </nav>
  <div class="lang" id="lang"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="ru">RU</button></div>
  <a class="cta" href="#contacto" data-t="cta"></a>
</header>

<div class="stage" id="stage">
  <div class="card" id="card"><canvas id="c"></canvas></div>
  <div class="ring">Scroll</div>
</div>
<section id="scrolly" aria-hidden="true"></section>

<div class="after">

  <section class="sec" id="proyecto">
    <div class="head">
      <div><p class="sk" data-t="pK"></p><h2 class="h2" data-t="pH"></h2></div>
      <div><p class="lede" data-t="pB1"></p><p class="lede" data-t="pB2"></p></div>
    </div>
    <div class="figs" id="figs"></div>

  const m = CONFIG.timeMap;
  for (let k = 0; k < m.length - 1; k++) if (p <= m[k + 1][0])
    return m[k][1] + (m[k + 1][1] - m[k][1]) * (p - m[k][0]) / (m[k + 1][0] - m[k][0]);
  return m[m.length - 1][1];
};
const timeToP = t => { // inversa (después de la portada)
  const m = CONFIG.timeMap;
  for (let k = 1; k < m.length - 1; k++) if (t <= m[k + 1][1] && m[k + 1][1] > m[k][1])
    return m[k][0] + (m[k + 1][0] - m[k][0]) * (t - m[k][1]) / (m[k + 1][1] - m[k][1]);

};

const mobileQ = matchMedia('(max-width:700px)');
function label(name, a, cx, cy, w, h) {
  const cw = mobileQ.matches ? 9.6 : 6.6, lh = mobileQ.matches ? 17 : 12.5;
  const lines = []; let cur = '';
  for (const word of name.split(' ')) { const t = cur ? cur + ' ' + word : word; if (t.length * cw > w - 8 && cur) { lines.push(cur); cur = word; } else cur = t; }
  lines.push(cur);
  const fits = Math.max(...lines.map(s => s.length)) * cw <= w - 6 && (lines.length + 1) * lh < h - 4;
  const m = `${fmt(a)} m²`;
  if (!fits) return w > 36 && h > 18 ? `<text class="m" x="${cx}" y="${cy + 4}">${m}</text>` : '';
  const y0 = cy - ((lines.length + 1) * lh) / 2 + lh * 0.8;
  return `<text x="${cx}" y="${y0}">${lines.map((s, i) => `<tspan x="${cx}" dy="${i ? lh : 0}">${s}</tspan>`).join('')}</text><text class="m" x="${cx}" y="${y0 + lines.length * lh}">${m}</text>`;
}
function renderPlan() {

  s += `<rect class="ghost" x="${px(g[0])}" y="${py(g[1])}" width="${g[2] * S}" height="${g[3] * S}"/>`;
  s += `<text class="ghost-t" x="${px(g[0]) + 6}" y="${py(g[1]) - 6}">${floor === 'pb' ? T.ghostPB : T.ghostPA}</text>`;
  if (floor === 'pa') s += `<rect class="ghost" x="${px(8)}" y="${py(13)}" width="${14 * S}" height="${4 * S}"/>`;

  for (const c of chapters) {

    const v = Math.min(vin, vout);
    c.el.style.opacity = v;
    c.el.style.transform = `translateY(${(1 - v) * 24}px)`;
    c.el.style.filter = v > 0.99 ? 'none' : `blur(${(1 - v) * 8}px)`;
    c.el.style.pointerEvents = v > 0.5 ? 'auto' : 'none';
  }
}

  const imgs = new Array(cfg.count);
  let loaded = 0, last = -1;
  const load = i => new Promise(res => {
    const im = new Image(); im.decoding = 'async';
    im.onload = () => { imgs[i] = im; loaded++; setLoad(loaded / cfg.count); res(); };
    im.onerror = res; im.src = cfg.path(i);
  });
  await Promise.all(Array.from({ length: Math.min(12, cfg.count) }, (_, i) => load(i)));
  (async () => { for (let i = 12; i < cfg.count; i += 10)
    await Promise.all(Array.from({ length: Math.min(10, cfg.count - i) }, (_, k) => load(i + k))); })();
  function resize() {
    const dpr = Math.min(devicePixelRatio, 2);
    canvas.width = cw() * dpr; canvas.height = ch() * dpr; last = -1;
  }
  function draw(i) {
    let im = imgs[i];
    for (let d = 1; !im && d < cfg.count; d++) im = imgs[i - d] || imgs[i + d];
    if (!im) return;
    const W = canvas.width, H = canvas.height, s = Math.max(W / im.width, H / im.height);
    const w = im.width * s, h = im.height * s;
    ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
  resize();
  return {
    resize,
    update(p) {
      const i = Math.min(cfg.count - 1, Math.round(videoTime(p) / CONFIG.seconds * (cfg.count - 1)));
      if (i !== last) { draw(i); last = i; }
    },
  };
}

/* ---------- Arranque ---------- */
applyLang(lang);
const view = await frameRenderer(CONFIG.frames);
addEventListener('resize', () => { view.resize(); readScroll(); lastP = -1; });
(function loop() {
  prog += (target - prog) * CONFIG.smooth;
  if (Math.abs(target - prog) < 1e-5) prog = target;
  if (prog !== lastP) { view.update(prog); updateUI(prog); lastP = prog; }
  requestAnimationFrame(loop);
})();
requestAnimationFrame(() => setTimeout(() => $('#loader').classList.add('done'), 250));
</script>
