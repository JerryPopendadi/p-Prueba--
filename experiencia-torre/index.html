<style>
:root{
  --bg:#ffffff;
  --ink:#0b0b0c;
  --blue:#3a4fd8;
  --blue-soft:#8ea2ff;
  --muted:#6e6e73;
  --line:#e7e7ea;
  --sans:"Inter Tight",system-ui,sans-serif;
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --pad:clamp(16px,2.6vw,36px);
  --hh:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--blue);letter-spacing:-.01em;text-transform:none}

/* ---------- Cabecera ---------- */
.nav{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:30;display:flex;align-items:center;gap:20px;padding:0 var(--pad);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-color:var(--line)}
.malbo{display:block;color:var(--ink)}
.nav .malbo{width:104px}
.links{margin-left:auto;display:flex;gap:4px}
.links a{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;color:var(--muted);transition:.25s}
.links a b{font-weight:500;color:var(--blue);margin-right:6px}
.links a:hover{color:var(--ink);background:#f3f3f5}
.lang{display:flex;gap:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em}
.lang button{border:0;background:none;cursor:pointer;font:inherit;color:var(--muted);padding:7px 8px;border-radius:999px}
.lang button.on{color:#fff;background:var(--ink)}
.cta{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:500;transition:.25s;white-space:nowrap}
.cta:hover{background:var(--ink)}

/* ---------- Escenario fijo: texto + vídeo ---------- */
.stage{position:fixed;top:var(--hh);left:0;right:0;bottom:0;z-index:1}
.card{position:absolute;inset:0;background:#f1f0ee;overflow:hidden}
.card canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* tarjetas de texto sobre la imagen */
.chap{position:absolute;left:var(--pad);bottom:var(--pad);width:min(520px,calc(100% - 2 * var(--pad)));background:#fff;border-radius:20px;padding:30px 32px 32px;box-shadow:0 20px 60px rgba(0,0,0,.12);opacity:0;will-change:transform,opacity,filter}
.chap.hero{width:min(760px,calc(100% - 2 * var(--pad)));padding:36px 40px 34px}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
.chap h2,.chap h1{font-weight:800;font-size:clamp(34px,3.6vw,60px);line-height:.93;letter-spacing:-.04em;text-transform:uppercase}
.chap h1{font-size:clamp(40px,5.4vw,92px)}
.chap h2 em,.chap h1 em{font-size:1.04em}
.chap p.body{margin-top:16px;font-size:15px;line-height:1.55;color:var(--muted)}
.scroll{display:flex;align-items:center;gap:12px;margin-top:26px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.scroll span{display:block;width:22px;height:34px;border:1.5px solid var(--ink);border-radius:12px;position:relative}
.scroll span::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--blue);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.btns{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:14px 20px;border-radius:999px;border:1px solid var(--ink);transition:.25s}
.btn.solid{background:var(--ink);color:#fff}
.btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}

#scrolly{position:relative;height:1700vh;z-index:0}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:60;background:#fff;display:grid;place-items:center;transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader .malbo{width:180px}
#loader .bar2{width:180px;height:2px;background:var(--line);margin-top:22px;overflow:hidden;border-radius:2px}
#loader .bar2 i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}

/* ---------- Secciones ---------- */
.after{position:relative;z-index:10;background:#fff}
section.block{padding:clamp(80px,12vw,160px) var(--pad) 0}
.sk{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:22px}
.lead{font-weight:800;font-size:clamp(34px,5.4vw,88px);line-height:.95;letter-spacing:-.045em;text-transform:uppercase;max-width:1200px}
.lead small{display:block;margin-top:22px;font-weight:500;font-size:clamp(18px,1.9vw,28px);line-height:1.25;letter-spacing:-.02em;text-transform:none;color:var(--muted);max-width:760px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(50px,7vw,90px);border-top:1px solid var(--ink);list-style:none}
.cols>*{padding:24px 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.cols>*:last-child{border-right:0}
.cols b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--blue)}
.cols h4{font-weight:800;font-size:22px;letter-spacing:-.03em;margin:14px 0 10px;text-transform:uppercase}
.cols p{font-size:14.5px;line-height:1.55;color:var(--muted)}
.stats .cols strong{display:block;font-weight:800;font-size:clamp(44px,6vw,96px);letter-spacing:-.05em;line-height:1;margin-top:12px;color:var(--ink)}
.stats .cols strong small{font-size:.4em;margin-left:6px;letter-spacing:0;color:var(--blue)}
.stats .cols span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.marquee{overflow:hidden;border-block:1px solid var(--line);margin-top:clamp(80px,10vw,140px);padding:20px 0;white-space:nowrap}
.track{display:inline-block;animation:mq 30s linear infinite;font-weight:900;font-size:clamp(48px,8vw,124px);letter-spacing:-.05em;text-transform:uppercase}
.track i{font-style:normal;color:var(--blue);font-size:.45em;vertical-align:middle;margin:0 .55em}
.track .o{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
@keyframes mq{to{transform:translateX(-50%)}}
.visit{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end;padding-bottom:clamp(80px,10vw,140px)}
.visit h3{font-weight:800;font-size:clamp(40px,6vw,96px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase}
.visit form{display:grid;gap:10px}
.visit input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:14px 0;outline:none;transition:border-color .2s}
.visit input:focus{border-color:var(--blue)}
.visit button{justify-self:start;margin-top:16px;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;border-radius:999px;border:0;background:var(--ink);color:#fff;transition:.25s}
.visit button:hover{background:var(--blue)}
footer{padding:28px var(--pad);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
footer .malbo{width:96px}

/* ---------- Móvil ---------- */
@media (max-width:860px){
  :root{--hh:60px}
  .links{display:none}
  .lang{margin-left:auto}
  .cta{padding:10px 14px;font-size:9.5px}
  .nav .malbo{width:84px}
  .chap,.chap.hero{padding:22px 22px 24px;border-radius:16px}
  .chap h2{font-size:clamp(28px,8.4vw,46px)}
  .chap h1{font-size:clamp(34px,10.5vw,60px)}
  .chap p.body{font-size:14px;margin-top:12px}
  .kicker{margin-bottom:10px}
  .cols{grid-template-columns:1fr 1fr;row-gap:30px}
  .cols h4{font-size:17px;hyphens:auto;overflow-wrap:anywhere}
  .cols>*{padding-right:12px;margin-right:12px}
  .cols>*:nth-child(2){border-right:0}
  .visit{grid-template-columns:1fr}
}
@media (max-width:420px){.cta{display:none}}
@media (prefers-reduced-motion:reduce){.track,.scroll span::after{animation:none}}
</style>

const videoTime = p => {
  const m = CONFIG.timeMap;
  for (let k = 0; k < m.length - 1; k++) if (p <= m[k + 1][0])
    return m[k][1] + (m[k + 1][1] - m[k][1]) * (p - m[k][0]) / (m[k + 1][0] - m[k][0]);
  return m[m.length - 1][1];
};

/* ---------- UI por frame ---------- */
const F = 0.025;
function updateUI(p) {
  chapters.forEach(c => {
    const vin = c.a <= 0 ? 1 : smooth(clamp((p - c.a) / F));
    const vout = c.b >= 1 ? 1 : smooth(clamp((c.b - p) / F));
    const v = Math.min(vin, vout);
    c.el.style.opacity = v;
    c.el.style.transform = `translateY(${(1 - v) * 24}px)`;
    c.el.style.filter = v > 0.99 ? 'none' : `blur(${(1 - v) * 8}px)`;
    c.el.style.pointerEvents = v > 0.5 ? 'auto' : 'none';
  });
}
const cw = () => card.clientWidth, ch = () => card.clientHeight;

/* =====================================================================
   RENDER 1 · secuencia de imágenes
   ===================================================================== */
async function frameRenderer(cfg) {
  const ctx = canvas.getContext('2d');
  const imgs = new Array(cfg.count);
  let loaded = 0, last = -1;
  const load = i => new Promise(res => {
    const im = new Image(); im.decoding = 'async';
    im.onload = () => { imgs[i] = im; loaded++; setLoad(loaded / cfg.count); res(); };
    im.onerror = res; im.src = cfg.path(i);
  });
  await Promise.all(Array.from({ length: Math.min(12, cfg.count) }, (_, i) => load(i)));
  (async () => { for (let i = 12; i < cfg.count; i += 10)
    await Promise.all(Array.from({ length: Math.min(10, cfg.count - i) }, (_, k) => load(i + k))); })();
  function resize() {
    const dpr = Math.min(devicePixelRatio, 2);
    canvas.width = cw() * dpr; canvas.height = ch() * dpr; last = -1;
  }
  function draw(i) {
    let im = imgs[i];
    for (let d = 1; !im && d < cfg.count; d++) im = imgs[i - d] || imgs[i + d];
    if (!im) return;
    const W = canvas.width, H = canvas.height, s = Math.max(W / im.width, H / im.height);
    const w = im.width * s, h = im.height * s;
    ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
  resize();
  return {
    resize,
    update(p) {
      const i = Math.min(cfg.count - 1, Math.round(videoTime(p) / CONFIG.seconds * (cfg.count - 1)));
      if (i !== last) { draw(i); last = i; }
    },
  };
}

/* =====================================================================
   RENDER 2 · torre 3D procedural (Three.js) — sin vídeo
   ===================================================================== */
async function threeRenderer() {
  const THREE = await import('three');
  setLoad(0.4);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xd9a77c, 160, 1100);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 4000);

  // ----- Cielo de atardecer (shader) -----
  const sunDir = new THREE.Vector3(-0.75, 0.16, 0.62).normalize();
  const skyMat = r => new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color(0x5d7697) }, mid: { value: new THREE.Color(0xf1c08c) },
      low: { value: new THREE.Color(0xe39a64) }, sun: { value: sunDir },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 top,mid,low,sun; varying vec3 vP;
      void main(){ float h=vP.y; vec3 c=mix(mid,top,smoothstep(.03,.5,h)); c=mix(low,c,smoothstep(-.08,.06,h));
      float s=max(dot(vP,sun),0.); c+=vec3(1.,.78,.5)*pow(s,300.)*3.+vec3(1.,.62,.32)*pow(s,8.)*.35;
      gl_FragColor=vec4(c,1.);
      #include <colorspace_fragment>
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), skyMat());
  scene.add(sky);
  // reflejos del cielo en el vidrio (environment map)
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat()));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 200).texture;

  // ----- Luces -----
  scene.add(new THREE.HemisphereLight(0xffe2c0, 0x2f2c30, 0.7));
  const sunL = new THREE.DirectionalLight(0xffb576, 3.2);
  sunL.position.copy(sunDir).multiplyScalar(300).add(new THREE.Vector3(0, 40, 0));
  sunL.target.position.set(0, 50, 0);
  sunL.castShadow = true;
  sunL.shadow.mapSize.set(2048, 2048);
  Object.assign(sunL.shadow.camera, { left: -90, right: 90, top: 140, bottom: -60, near: 10, far: 700 });
  sunL.shadow.bias = -0.0004;
  scene.add(sunL, sunL.target);

  // ----- Suelo, solar y calles -----
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000),
    new THREE.MeshStandardMaterial({ color: 0x3a3936, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(64, 56),
    new THREE.MeshStandardMaterial({ color: 0x9b958c, roughness: 0.9 }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.02; pad.receiveShadow = true; scene.add(pad);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2b, roughness: 0.8 });
  for (const [w, d, x, z] of [[5000, 14, 0, 45], [14, 5000, 45, 0], [14, 5000, -45, 0]]) {
    const r = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
    r.rotation.x = -Math.PI / 2; r.position.set(x, 0.03, z); r.receiveShadow = true; scene.add(r);
  }

  // ----- Ciudad alrededor (instanced) -----
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cityCount = 520;
  const boxGeo = new THREE.BoxGeometry(1, 1, 1); boxGeo.translate(0, 0.5, 0);
  const city = new THREE.InstancedMesh(boxGeo,
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75, metalness: 0.15 }), cityCount);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  for (let i = 0; i < cityCount; i++) {
    let x, z;
    do { x = (rnd() - 0.5) * 1400; z = (rnd() - 0.5) * 1400; }
    while (Math.hypot(x, z) < 85 || Math.abs(z - 45) < 14 || Math.abs(x - 45) < 14 || Math.abs(x + 45) < 14);
    // sin torres altas detrás del solar en el plano inicial
    const behind = (-0.53 * x - 0.85 * z) > 0 && Math.abs(-0.85 * x + 0.53 * z) < 160;
    const tall = !behind && rnd() < 0.08;
    const h = tall ? 60 + rnd() * 70 : 6 + rnd() * rnd() * (behind ? 22 : 40);
    const w = 12 + rnd() * 26, d = 12 + rnd() * 26;
    m4.makeScale(w, h, d).setPosition(x, 0, z);
    city.setMatrixAt(i, m4);
    city.setColorAt(i, col.setHSL(0.07, 0.07, 0.2 + rnd() * 0.2));
  }
  city.receiveShadow = true; scene.add(city);

  // ----- Texturas de fachada (montantes + ventanas iluminadas) -----
  function canvasTex(draw, w = 1024, h = 128) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  }
  const mullionTex = canvasTex((g, w, h) => {
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#4a4a4a';
    for (let x = 0; x < w; x += w / 16) g.fillRect(x, 0, 5, h);
    g.fillRect(0, h * 0.86, w, 3);
  });
  const litTex = Array.from({ length: 4 }, () => canvasTex((g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += w / 16) if (rnd() < 0.45) {
      const grd = g.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, '#fff'); grd.addColorStop(1, '#7a5a3a');
      g.fillStyle = grd; g.fillRect(x + 5, 0, w / 16 - 5, h);
    }
  }));

  // ----- La torre -----
  const N = 32, H = 3.6, W = 22, D = 16, T = 27; // plantas, altura planta, ancho, fondo, planta del interior
  const stone = new THREE.MeshStandardMaterial({ color: 0xebe5db, roughness: 0.55 });
  const slabGeo = new THREE.BoxGeometry(W + 1, 0.4, D + 3); slabGeo.translate(0, 0.2, 1.5); // vuelo de 3 m = terraza
  const glassGeo = new THREE.BoxGeometry(W, H - 0.4, D); glassGeo.translate(0, 0.4 + (H - 0.4) / 2, 0);
  const railGeo = new THREE.BoxGeometry(W + 1, 0.05, 0.06); railGeo.translate(0, 1.5, D / 2 + 2.95);
  const railGlassGeo = new THREE.BoxGeometry(W + 1, 1.1, 0.03); railGlassGeo.translate(0, 0.95, D / 2 + 2.95);
  const railGlassMat = new THREE.MeshStandardMaterial({ color: 0x9fb0b8, transparent: true, opacity: 0.18, roughness: 0.05, metalness: 0.5 });
  const tower = new THREE.Group(); scene.add(tower);
  const floors = [], glassMats = [];

  for (let i = 0; i <= N; i++) {
    const g = new THREE.Group(); g.position.y = i * H;
    const slab = new THREE.Mesh(slabGeo, stone); slab.castShadow = slab.receiveShadow = true; g.add(slab);
    if (i < N && i !== T) {
      const gm = new THREE.MeshStandardMaterial({
        color: 0x222a36, metalness: 0.9, roughness: 0.12, map: mullionTex,
        emissive: 0xffb46a, emissiveMap: litTex[i % 4], emissiveIntensity: 0,
      });
      gm.userData.lit = 0.25 + rnd() * 0.9;
      glassMats.push(gm);
      const glass = new THREE.Mesh(glassGeo, gm); glass.castShadow = true; glass.receiveShadow = true; g.add(glass);
    }
    if (i < N) { g.add(new THREE.Mesh(railGeo, stone)); g.add(new THREE.Mesh(railGlassGeo, railGlassMat)); }
    if (i === N) { // remate
      const crown = new THREE.Mesh(new THREE.BoxGeometry(W - 6, 3, D - 6), stone);
      crown.position.y = 1.9; crown.castShadow = true; g.add(crown);
    }
    tower.add(g);
    floors.push({ g, t0: 0.15 + (i / N) * 0.25 });
  }

  // "La costura": espina pálida que serpentea por la fachada
  const seam = [];
  const seamMat = new THREE.MeshStandardMaterial({ color: 0xf6efe4, roughness: 0.4, emissive: 0xffd9a8, emissiveIntensity: 0.15 });
  for (let i = 0; i < N; i++) {
    if (i === T) continue; // deja libre la logia por la que entra la cámara
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, H, 1.2), seamMat);
    b.geometry.translate(0, H / 2, 0);
    b.position.set(-4 + Math.sin(i * 0.3) * 5, i * H + 0.4, D / 2 + 3.6);
    b.castShadow = true; tower.add(b);
    seam.push({ b, t0: 0.43 + (i / N) * 0.14 });
  }

  // ----- Interior (planta T) -----
  {
    const room = floors[T].g; // el interior aparece con su planta
    const y0 = 0.4, hh = H - 0.4;
    const wood = new THREE.MeshStandardMaterial({ color: 0xa06d44, roughness: 0.5 });
    const darkWood = new THREE.MeshStandardMaterial({ color: 0x5a3a26, roughness: 0.45 });
    const white = new THREE.MeshStandardMaterial({ color: 0xf0ebe3, roughness: 0.85 });
    const fabric = new THREE.MeshStandardMaterial({ color: 0xe9e2d6, roughness: 1 });
    const glow = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffc58a, emissiveIntensity: 3 });
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; room.add(m); return m; };
    add(new THREE.BoxGeometry(W, hh, 0.3), wood, 0, y0 + hh / 2, -D / 2 + 0.15);               // pared de madera
    for (let x = -W / 2 + 1; x < W / 2; x += 0.5) add(new THREE.BoxGeometry(0.18, hh, 0.12), darkWood, x, y0 + hh / 2, -D / 2 + 0.36); // listones
    add(new THREE.BoxGeometry(0.3, hh, D), white, -W / 2 + 0.15, y0 + hh / 2, 0);
    add(new THREE.BoxGeometry(0.3, hh, D), white, W / 2 - 0.15, y0 + hh / 2, 0);
    add(new THREE.BoxGeometry(W - 1, 0.05, 0.25), glow, 0, H - 0.08, -D / 2 + 0.8);             // luz lineal en techo
    add(new THREE.BoxGeometry(8, 0.02, 5.5), new THREE.MeshStandardMaterial({ color: 0xcfc5b4, roughness: 1 }), -3, y0 + 0.01, -2); // alfombra
    add(new THREE.BoxGeometry(5.2, 0.45, 1.9), fabric, -3, y0 + 0.22, -3.4);                    // sofá
    add(new THREE.BoxGeometry(5.2, 0.8, 0.45), fabric, -3, y0 + 0.65, -4.2);
    add(new THREE.BoxGeometry(0.4, 0.65, 1.9), fabric, -5.6, y0 + 0.33, -3.4);
    add(new THREE.BoxGeometry(0.4, 0.65, 1.9), fabric, -0.4, y0 + 0.33, -3.4);
    add(new THREE.BoxGeometry(0.9, 0.55, 0.22), darkWood, -4.4, y0 + 0.75, -3.85);              // cojín
    add(new THREE.BoxGeometry(2.4, 0.36, 1.2), darkWood, -3, y0 + 0.18, -1.2);                  // mesa
    add(new THREE.BoxGeometry(0.7, 0.12, 0.5), white, -2.6, y0 + 0.42, -1.2);                   // libros
    add(new THREE.BoxGeometry(1.2, 0.5, 1.2), darkWood, 2.2, y0 + 0.4, 0.2).rotation.y = -0.5;  // butaca
    add(new THREE.BoxGeometry(4.5, 0.95, 1.3), wood, 6, y0 + 0.47, -2.2);                       // isla cocina
    add(new THREE.BoxGeometry(4.7, 0.06, 1.4), white, 6, y0 + 0.97, -2.2);
    for (let k = 0; k < 4; k++) add(new THREE.BoxGeometry(5, 0.06, 0.45), darkWood, 6, y0 + 0.8 + k * 0.6, -D / 2 + 0.6); // estantes
    for (let k = 0; k < 14; k++) add(new THREE.BoxGeometry(0.12, 0.3 + rnd() * 0.15, 0.3), k % 3 ? white : wood, 3.8 + k * 0.3, y0 + 1.05 + (k % 3) * 0.6, -D / 2 + 0.6);
    add(new THREE.CylinderGeometry(0.03, 0.03, 1.6), darkWood, -6.5, y0 + 0.8, -4);             // lámpara
    add(new THREE.CylinderGeometry(0.28, 0.38, 0.45, 24, 1, true), glow, -6.5, y0 + 1.75, -4);
    const l1 = new THREE.PointLight(0xffc28a, 18, 16, 2); l1.position.set(-6.5, y0 + 1.6, -3.8); room.add(l1);
    const l2 = new THREE.PointLight(0xffc690, 12, 18, 2); l2.position.set(3, H - 1.1, -3); room.add(l2);
    const l3 = new THREE.PointLight(0xffd1a0, 6, 14, 2); l3.position.set(-2, H - 1.2, 2); room.add(l3);
  }

  // ----- Recorrido de cámara: [progreso, posición, punto al que mira] -----
  const yT = T * H;
  const K = [
    [0.00, [62, 2.2, 100], [0, 7, 0]],
    [0.14, [50, 3.5, 84], [0, 9, 0]],
    [0.30, [34, 30, 92], [0, 32, 0]],
    [0.43, [-30, 66, 92], [0, 58, 0]],
    [0.58, [-80, 112, 50], [0, 84, 0]],
    [0.70, [-30, 104, 58], [0, yT + 2, 4]],
    [0.80, [0, yT + 2.6, 30], [0, yT + 1.9, 0]],
    [0.90, [0.6, yT + 1.9, 12], [-0.5, yT + 1.5, -4]],
    [1.00, [1.2, yT + 1.75, 4.5], [-1.5, yT + 1.25, -7]],
  ];
  const V = a => new THREE.Vector3(...a);
  const posC = new THREE.CatmullRomCurve3(K.map(k => V(k[1])), false, 'centripetal');
  const lookC = new THREE.CatmullRomCurve3(K.map(k => V(k[2])), false, 'centripetal');
  const keyU = p => {
    for (let s = 0; s < K.length - 1; s++) if (p <= K[s + 1][0])
      return (s + (p - K[s][0]) / (K[s + 1][0] - K[s][0])) / (K.length - 1);
    return 1;
  };

  let mx = 0, my = 0, smx = 0, smy = 0;
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });

  const camPos = new THREE.Vector3(), look = new THREE.Vector3();
  function resize() {
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(cw(), ch(), false);
    camera.aspect = cw() / ch(); camera.updateProjectionMatrix();
  }
  resize();

  function update(p) {
    // plantas que se levantan una a una
    for (const f of floors) {
      const k = smooth(clamp((p - f.t0) / 0.03));
      f.g.visible = k > 0.001; f.g.scale.y = Math.max(k, 0.001);
    }
    for (const s of seam) {
      const k = smooth(clamp((p - s.t0) / 0.025));
      s.b.visible = k > 0.001; s.b.scale.y = Math.max(k, 0.001);
    }
    // ventanas que se encienden al caer la tarde
    const lit = 0.15 + smooth(clamp((p - 0.35) / 0.4)) * 1.6;
    for (const m of glassMats) m.emissiveIntensity = m.userData.lit * lit;
    seamMat.emissiveIntensity = 0.1 + smooth(clamp((p - 0.43) / 0.15)) * 0.5;

    // cámara
    const u = keyU(p);
    posC.getPoint(u, camPos); lookC.getPoint(u, look);
    smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
    const par = p > 0.85 ? 0.6 : 3;
    camera.position.copy(camPos).add(new THREE.Vector3(smx * par, -smy * par * 0.5, 0));
    camera.lookAt(look);
    const baseFov = camera.aspect < 1 ? 58 : 38;
    camera.fov = baseFov + smooth(clamp((p - 0.78) / 0.2)) * 16;
    camera.updateProjectionMatrix();
    renderer.toneMappingExposure = 1 + smooth(clamp((p - 0.82) / 0.18)) * 0.05;
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
  }
  setLoad(1);
  return { resize, update, continuous: true };
}

/* ---------- Arranque ---------- */
applyLang(lang);
const view = VIDEO ? await frameRenderer(CONFIG.frames) : await threeRenderer();
addEventListener('resize', () => { view.resize(); readScroll(); lastP = -1; });
(function loop() {
  prog += (target - prog) * CONFIG.smooth;
  if (Math.abs(target - prog) < 1e-5) prog = target;
  if (view.continuous || prog !== lastP) { view.update(prog); updateUI(prog); lastP = prog; }
  requestAnimationFrame(loop);
})();
requestAnimationFrame(() => setTimeout(() => $('#loader').classList.add('done'), 250));

/* ---------- Contadores ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  io.unobserve(e.target);
  const el = e.target, to = +el.dataset.count, from = +(el.dataset.from || 0), suf = el.dataset.suffix;
  const t0 = performance.now();
  (function tick(now) {
    const k = clamp((now - t0) / 1600), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    el.innerHTML = v + (suf ? `<small>${suf}</small>` : '');
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}), { threshold: 0.6 });
document.querySelectorAll('[data-count]').forEach(el => io.observe(el));
</script>
