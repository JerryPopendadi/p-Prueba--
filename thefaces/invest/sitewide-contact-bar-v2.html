window.dataLayer=window.dataLayer||[];
function track(ev,p){try{window.dataLayer.push(Object.assign({event:ev},p||{}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* language: the page's language block (pages with their own switcher) or <html lang> */
var ROOTS='#tfSite,#tfw,#wt,#faces-ubud,#tf1,[data-tf-lang-root]';
function langEl(){var r=document.querySelector(ROOTS);return (r&&r.getAttribute('lang'))?r:document.documentElement}
function lang(){var l=(langEl().getAttribute('lang')||'en').toLowerCase().slice(0,2);if(l==='ua')l='uk';if(l==='in')l='id';return T[l]?l:'en'}
var bar=document.createElement('div');bar.id='tfc';bar.setAttribute('data-noi18n','');bar.setAttribute('translate','no');
var modal=document.createElement('div');modal.id='tfc-modal';modal.hidden=true;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('data-noi18n','');
modal.innerHTML='<div class="tfc-box" tabindex="-1"><div class="tfc-top"><button type="button" class="tfc-mx" aria-label="Close">×</button></div><div class="tfc-in"><p class="tfc-ttl"></p><p class="tfc-sub"></p><div class="tfc-slot"></div><ul class="tfc-trust"><li></li><li></li><li></li></ul></div></div>';
function render(){var t=T[lang()],h='';
 h+='<div class="tfc-panel" id="tfc-panel" role="dialog" aria-label="'+esc(t[1])+'"><div class="tfc-h"><b>'+esc(t[1])+'</b><button type="button" class="tfc-x" aria-label="'+esc(t[10])+'">×</button></div>';
 if(CONFIG.calendar)h+='<a class="tfc-o main" data-a="book" href="'+CONFIG.calendar+'" target="_blank" rel="noopener"><span class="tfc-i">'+I.cal+'</span><span><span class="tfc-t">'+esc(t[2])+'</span><span class="tfc-s">'+esc(t[3])+'</span></span></a>';
 h+='<button type="button" class="tfc-o" data-a="form"><span class="tfc-i">'+I.form+'</span><span><span class="tfc-t">'+esc(t[4])+'</span><span class="tfc-s">'+esc(t[5])+'</span></span></button>';
 if(CONFIG.whatsapp)h+='<a class="tfc-o" data-a="whatsapp" href="https://wa.me/'+CONFIG.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(t[11])+'" target="_blank" rel="noopener"><span class="tfc-i">'+I.wa+'</span><span><span class="tfc-t">'+esc(t[6])+'</span><span class="tfc-s">'+esc(t[7])+'</span></span></a>';
 var row='';
 if(CONFIG.phone)row+='<a class="tfc-o" data-a="call" href="tel:'+CONFIG.phone.replace(/[^\d+]/g,'')+'"><span class="tfc-i">'+I.tel+'</span><span class="tfc-t">'+esc(t[8])+'</span></a>';
 if(CONFIG.email)row+='<a class="tfc-o" data-a="email" href="mailto:'+CONFIG.email+'"><span class="tfc-i">'+I.mail+'</span><span class="tfc-t">'+esc(t[9])+'</span></a>';
 if(row)h+='<div class="tfc-row">'+row+'</div>';
 h+='<label class="tfc-c"><input type="checkbox" id="tfc-ok"'+(consented()?' checked':'')+'><span>'+esc(t[12]).replace('{p}','<a href="'+CONFIG.privacyUrl+'" target="_blank" rel="noopener">'+esc(t[13])+'</a>')+'</span></label><p class="tfc-need" role="alert" hidden>'+esc(t[14])+'</p>';
 h+='</div><button type="button" class="tfc-fab" aria-expanded="'+bar.classList.contains('open')+'" aria-controls="tfc-panel"><span class="tfc-dot" aria-hidden="true"></span>'+I.chat+'<span>'+esc(t[0])+'</span></button>';
 bar.innerHTML=h;
 modal.setAttribute('lang',lang());modal.querySelector('.tfc-mx').setAttribute('aria-label',t[10]);
 modal.querySelector('.tfc-ttl').textContent=t[15];modal.querySelector('.tfc-sub').textContent=t[16];
 var li=modal.querySelectorAll('.tfc-trust li');li[0].textContent=t[17];li[1].textContent=t[18];li[2].textContent=t[19];
 var cal=modal.querySelector('.tfc-cal');if(cal)cal.textContent=t[20];}
function setOpen(o){bar.classList.toggle('open',o);var f=bar.querySelector('.tfc-fab');if(f)f.setAttribute('aria-expanded',o);if(o)track('thefaces_contact_open')}
var CK='tfc_consent';
function consented(){try{return sessionStorage.getItem(CK)==='1'}catch(e){return !!window.__tfcOk}}
function setConsent(v){window.__tfcOk=v;try{v?sessionStorage.setItem(CK,'1'):sessionStorage.removeItem(CK)}catch(e){}}

/* ---------- Forminator 703: move it into the window, fill hidden fields, send the conversion ---------- */
var attr={};try{var q=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid'].forEach(function(k){var v=q.get(k);if(v)attr[k]=String(v).slice(0,150)});
 if(Object.keys(attr).length)sessionStorage.setItem('tf_attr',JSON.stringify(attr));else attr=JSON.parse(sessionStorage.getItem('tf_attr')||'{}')}catch(e){}
function investorPage(){return !!document.getElementById('tf1')}      /* the investor page has its own form + tracking */
function srcForm(){var s=document.getElementById('tf-form-703-src');return (s&&s.querySelector('form.forminator-custom-form'))||modal.querySelector('form.forminator-custom-form')}
function fEl(form,key){var n=(CONFIG.fields||{})[key]||(CONFIG.hidden||{})[key];if(!n)return null;return form.querySelector('[name="'+n+'"]')||form.querySelector('[name^="'+n+'-"]')}
function fVal(form,key){var el=fEl(form,key);if(!el)return '';
 if(el.type==='radio'||el.type==='checkbox'){var c=form.querySelector('[name="'+el.name+'"]:checked');return c?c.value:''}
 if(key==='name'&&el.name!==CONFIG.fields.name)return [].map.call(form.querySelectorAll('[name^="'+CONFIG.fields.name+'-"]'),function(x){return x.value}).join(' ').trim();
 return String(el.value||'').trim()}
var pending=null;
function wire(form){
 if(!form||form.dataset.tfcWired)return;form.dataset.tfcWired='1';
 form.addEventListener('focusin',function(){if(!form.dataset.started){form.dataset.started='1';track('thefaces_form_start',{form_id:CONFIG.formId,placement:'contact_bar'})}});
 form.addEventListener('submit',function(){
  var em=fVal(form,'email'),nm=fVal(form,'name');
  if(!/^[^\s@<>"'()]+@[^\s@<>"'()]+\.[a-z]{2,}$/i.test(em)||nm.replace(/\s/g,'').length<2)return;    /* empty: Forminator shows its errors; nothing is counted */
  var id='lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  var hv={lead_id:id,language:lang(),placement:'contact_bar',page:location.href.split('#')[0].slice(0,250)};for(var k in attr)hv[k]=attr[k];
  Object.keys(CONFIG.hidden||{}).forEach(function(k){var el=fEl(form,k);if(el&&hv[k]!==undefined)el.value=hv[k]});
  pending={lead_id:id,name:nm,email:em,phone:fVal(form,'phone'),country:fVal(form,'country'),budget:fVal(form,'budget'),hv:hv};
 },true);
 function done(){if(!pending)return;var d=pending;pending=null;
  track('generate_lead',{lead_id:d.lead_id,form_id:'forminator_'+CONFIG.formId,lead_method:'forminator',budget:d.budget||'not_given',country:d.country||'',form_language:lang(),
   placement:'contact_bar',page_path:location.pathname,value:CONFIG.leadValue,currency:'USD',utm_source:attr.utm_source,utm_medium:attr.utm_medium,utm_campaign:attr.utm_campaign,gclid:attr.gclid});
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.sheetUrl||'')){var F=CONFIG.fields,H=CONFIG.hidden,row={};
   row[F.name]=d.name;row[F.email]=d.email;if(d.phone)row[F.phone]=d.phone;if(d.country)row[F.country]=d.country;if(d.budget)row[F.budget]=d.budget;
   Object.keys(H).forEach(function(k){if(d.hv[k]!==undefined)row[H[k]]=d.hv[k]});
   try{fetch(CONFIG.sheetUrl,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams(row)})}catch(x){}}
  if(CONFIG.calendar&&!modal.querySelector('.tfc-cal')){var a=document.createElement('a');a.className='tfc-cal';a.href=CONFIG.calendar;a.target='_blank';a.rel='noopener';a.textContent=T[lang()][20];
   a.addEventListener('click',function(){track('thefaces_booking_click',{source:'after_lead'})});modal.querySelector('.tfc-slot').appendChild(a)}
 }
 if(window.jQuery){var $j=window.jQuery;$j(document).on('forminator:form:submit:success',function(e){if(e.target===form||$j(form).is(e.target)||$j(e.target).closest(form).length)done()});
  $j(document).on('forminator:form:submit:failed',function(e){if(e.target===form||$j(form).is(e.target))pending=null})}
 try{new MutationObserver(function(){if(pending&&form.querySelector('.forminator-response-message.forminator-success,.forminator-success'))done()}).observe(form,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})}catch(e){}
}
function openForm(){
 /* investor page: go to its own form (it does its own tracking) */
 var onPage=document.getElementById('tf1-contact')||document.getElementById('tf1-form-slot');
 if(investorPage()&&onPage){setOpen(false);onPage.scrollIntoView({behavior:'smooth',block:'start'});return}
 var form=srcForm(),slot=modal.querySelector('.tfc-slot');
 if(!form){                                   /* PHP snippet missing: link to the investor page */
  if(!slot.querySelector('.tfc-miss'))slot.innerHTML='<p class="tfc-miss">'+esc(T[lang()][21])+' <a href="mailto:'+CONFIG.email+'">'+CONFIG.email+'</a> · <a href="'+CONFIG.calendar+'" target="_blank" rel="noopener">'+esc(T[lang()][2])+'</a></p>';
 }else if(!slot.contains(form)){slot.appendChild(form);wire(form)}
 modal.hidden=false;document.documentElement.classList.add('tfc-lock');setOpen(false);modal.querySelector('.tfc-box').scrollTop=0;
 setTimeout(function(){var n=form&&form.querySelector('input:not([type=hidden])');if(n)try{n.focus({preventScroll:true})}catch(e){}},250);}
function closeForm(){modal.hidden=true;document.documentElement.classList.remove('tfc-lock');var f=bar.querySelector('.tfc-fab');if(f)f.focus()}
bar.addEventListener('click',function(e){
 if(e.target.closest('.tfc-fab')){setOpen(!bar.classList.contains('open'));return}
 if(e.target.closest('.tfc-x')){setOpen(false);return}
 var o=e.target.closest('[data-a]');if(!o)return;var a=o.getAttribute('data-a');
 /* the form has its own consent; direct channels need the consent box */
 if(a!=='form'&&!consented()){e.preventDefault();var n=bar.querySelector('.tfc-need'),c=bar.querySelector('.tfc-c');n.hidden=false;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');bar.querySelector('#tfc-ok').focus();return}
 if(a!=='form')track('thefaces_contact_consent',{consent:'yes',ts:new Date().toISOString()});
 track('thefaces_contact_click',{contact_method:a});
 if(a==='book')track('thefaces_booking_click',{source:'contact_bar'});
 if(a==='whatsapp')track('thefaces_whatsapp_click',{source:'contact_bar'});
 if(a==='form'){openForm()}else{setOpen(false)}});
bar.addEventListener('change',function(e){if(e.target.id==='tfc-ok'){setConsent(e.target.checked);if(e.target.checked)bar.querySelector('.tfc-need').hidden=true}});
modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('.tfc-mx'))closeForm()});
document.addEventListener('click',function(e){if(bar.classList.contains('open')&&!bar.contains(e.target))setOpen(false)});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!modal.hidden)closeForm();else setOpen(false)});
/* any link to #request / #tfc-form on the site also opens the form */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href="#request"],a[href="#tfc-form"],a[href$="#request"]');if(a){e.preventDefault();openForm()}});
function mount(){document.body.appendChild(bar);document.body.appendChild(modal);render();
 if(!investorPage()){var f0=srcForm();if(f0)wire(f0)}
 var last=lang(),mo=new MutationObserver(function(){if(lang()!==last){last=lang();render()}});
 mo.observe(document.documentElement,{attributes:true,attributeFilter:['lang'],subtree:true});
 if(/[#&](request|tfc-form)\b/.test(location.hash))setTimeout(openForm,400);}
if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount);
})();
</script>
