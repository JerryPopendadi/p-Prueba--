     The form itself comes from a small WPCode PHP snippet (see GUIA: it prints the form hidden at the end of the page);

var f=document.createElement('footer');f.id='tflf';f.setAttribute('role','contentinfo');f.setAttribute('data-noi18n','');f.setAttribute('translate','no');
var ckb=document.createElement('div');ckb.id='tflf-ck';ckb.hidden=true;ckb.setAttribute('role','dialog');ckb.setAttribute('data-noi18n','');
var fp=document.createElement('div');fp.className='fp';fp.id='tflf-enquiry';
var openSec=-1;
function pageHasOwnForm(){return !!document.getElementById('tf1')}   /* Book an Investor Meeting page: its own form and tracking */
function render(){var l=lang(),t=L[l],p=P[l]||P.en,y=new Date().getFullYear(),S='<span class="sep" aria-hidden="true">·</span>';
 function link(label,url,sec){return url?'<a href="'+url+'" target="_blank" rel="noopener">'+esc(label)+'</a>':'<button type="button" class="k" data-sec="'+sec+'" aria-expanded="'+(openSec===sec)+'" aria-controls="tflf-p">'+esc(label)+'</button>'}
 var enq=pageHasOwnForm()?'':'<button type="button" class="k enq" data-enq="1" aria-controls="tflf-enquiry">'+esc(t[13])+'</button>'+S;
 var h='<div class="l"><span class="c">© '+y+' '+esc(CONFIG.brand)+'. '+esc(t[7])+'</span>'+enq+
  link(t[0],CONFIG.privacyUrl,2)+S+link(t[1],CONFIG.cookieUrl,3)+S+link(t[2],CONFIG.termsUrl,4)+S+
  '<button type="button" class="k" data-sec="0" aria-controls="tflf-p">'+esc(t[3])+'</button>'+S+
  '<button type="button" class="k" data-sec="1" aria-controls="tflf-p">'+esc(t[4])+'</button>'+S+
  '<button type="button" class="k" data-sec="2" aria-controls="tflf-p">'+esc(t[5])+'</button>'+S+
  '<button type="button" class="k" data-ck="1">'+esc(t[6])+'</button>'+S+
  '<a href="mailto:'+CONFIG.email+'">'+esc(CONFIG.email)+'</a></div>'+
  '<div class="p" id="tflf-p"><div class="pi"><button type="button" class="x">'+esc(t[8])+' ×</button>';
 p.h.forEach(function(hh,i){h+='<h4 id="tflf-s'+i+'">'+esc(hh)+'</h4>'+p.t[i](CONFIG)});
 h+='</div></div>';
 var keep=fp.querySelector('form');           /* keep the live Forminator form when the language changes */
 f.innerHTML=h;f.appendChild(fp);
 var head='<div class="fc"><div class="fh"><strong>'+esc(t[13])+'</strong><button type="button" class="fx">'+esc(t[8])+' ×</button></div><p class="fs">'+esc(t[14])+'</p><div class="fslot"></div></div>';
 if(!fp.querySelector('.fc'))fp.innerHTML=head;else{fp.querySelector('.fh strong').textContent=t[13];fp.querySelector('.fx').textContent=t[8]+' ×';fp.querySelector('.fs').textContent=t[14]}
 if(keep&&!fp.contains(keep))fp.querySelector('.fslot').appendChild(keep);
 ckb.innerHTML='<p>'+esc(t[9])+' <a href="#tflf-s3" data-sec="3">'+esc(t[12])+'</a></p><div class="r"><button type="button" class="n">'+esc(t[10])+'</button><button type="button" class="y">'+esc(t[11])+'</button></div>';
 if(openSec>-1)f.classList.add('open');}
function show(sec){openSec=sec;f.classList.add('open');var h=document.getElementById('tflf-s'+sec);if(h)setTimeout(function(){h.scrollIntoView({behavior:'smooth',block:'start'})},30);try{(window.dataLayer=window.dataLayer||[]).push({event:'thefaces_legal_open',section:sec})}catch(e){}}
f.addEventListener('click',function(e){var b=e.target.closest('[data-sec]');if(b){e.preventDefault();show(+b.getAttribute('data-sec'));return}
 if(e.target.closest('.x')){openSec=-1;f.classList.remove('open');return}
 if(e.target.closest('.fx')){f.classList.remove('fopen');return}
 if(e.target.closest('[data-enq]')){openEnquiry('footer');return}
 if(e.target.closest('[data-ck]'))cookieSettings()});

/* ---------- enquiry form (Forminator) + conversion ---------- */
window.dataLayer=window.dataLayer||[];function gtag(){window.dataLayer.push(arguments)}
var attr={};try{var q=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid'].forEach(function(k){var v=q.get(k);if(v)attr[k]=String(v).slice(0,150)});
 if(Object.keys(attr).length)sessionStorage.setItem('tf_attr',JSON.stringify(attr));else attr=JSON.parse(sessionStorage.getItem('tf_attr')||'{}')}catch(e){}
var lastPlace='';
function ffForm(){var src=document.getElementById('tflf-form-src');return (src&&src.querySelector('form.forminator-custom-form'))||fp.querySelector('form.forminator-custom-form')}
function openEnquiry(place){
 lastPlace=place||'footer';var form=ffForm();
 if(!form){location.href=CONFIG.investorPage;return}      /* PHP snippet missing: go to the investor page */
 var slot=fp.querySelector('.fslot');if(!slot.contains(form))slot.appendChild(form);
 f.classList.add('fopen');wire(form);
 setTimeout(function(){fp.scrollIntoView({behavior:'smooth',block:'start'})},30);
 window.dataLayer.push({event:'thefaces_cta',placement:'footer_enquiry'});
}
function fEl(form,key){var n=(CONFIG.fields||{})[key]||(CONFIG.hidden||{})[key];if(!n)return null;return form.querySelector('[name="'+n+'"]')||form.querySelector('[name^="'+n+'-"]')}
function fVal(form,key){var el=fEl(form,key);if(!el)return '';if(el.type==='radio'||el.type==='checkbox'){var c=form.querySelector('[name="'+el.name+'"]:checked');return c?c.value:''}
 if(key==='name'&&el.name!==CONFIG.fields.name){return Array.prototype.map.call(form.querySelectorAll('[name^="'+CONFIG.fields.name+'-"]'),function(x){return x.value}).join(' ').trim()}
 return String(el.value||'').trim()}
var pending=null;
function wire(form){
 if(!form||form.dataset.tflfWired)return;form.dataset.tflfWired='1';
 form.addEventListener('focusin',function(){if(!form.dataset.started){form.dataset.started='1';window.dataLayer.push({event:'thefaces_form_start',form_id:CONFIG.formId,placement:'footer'})}});
 form.addEventListener('submit',function(){
  var em=fVal(form,'email'),nm=fVal(form,'name');
  if(!/^[^\s@<>"'()]+@[^\s@<>"'()]+\.[a-z]{2,}$/i.test(em)||nm.replace(/\s/g,'').length<2)return;   /* empty: Forminator shows its errors, nothing is tracked */
  var id='lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  var hv={lead_id:id,language:lang(),placement:lastPlace||'footer',page:location.href.split('#')[0].slice(0,250)};for(var k in attr)hv[k]=attr[k];
  Object.keys(CONFIG.hidden||{}).forEach(function(k){var el=fEl(form,k);if(el&&hv[k]!==undefined)el.value=hv[k]});
  pending={lead_id:id,name:nm,email:em,phone:fVal(form,'phone'),country:fVal(form,'country'),budget:fVal(form,'budget'),hv:hv};
 },true);
 function done(){if(!pending)return;var d=pending;pending=null;
  window.dataLayer.push({event:'generate_lead',lead_id:d.lead_id,form_id:'forminator_'+CONFIG.formId,lead_method:'forminator',budget:d.budget||'not_given',country:d.country||'',
   form_language:lang(),placement:d.hv.placement,page_type:'footer',value:CONFIG.leadValue,currency:'USD',utm_source:attr.utm_source,utm_medium:attr.utm_medium,utm_campaign:attr.utm_campaign,gclid:attr.gclid});
  if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(CONFIG.sheetUrl||'')){var F=CONFIG.fields,H=CONFIG.hidden,row={};
   row[F.name]=d.name;row[F.email]=d.email;if(d.phone)row[F.phone]=d.phone;if(d.country)row[F.country]=d.country;if(d.budget)row[F.budget]=d.budget;
   Object.keys(H).forEach(function(k){if(d.hv[k]!==undefined)row[H[k]]=d.hv[k]});
   try{fetch(CONFIG.sheetUrl,{method:'POST',mode:'no-cors',keepalive:true,body:new URLSearchParams(row)})}catch(x){}}
  if(!fp.querySelector('.tflf-cal')){var a=document.createElement('a');a.className='tflf-cal';a.href=CONFIG.calendar;a.target='_blank';a.rel='noopener';a.textContent=L[lang()][15];fp.querySelector('.fc').appendChild(a)}
 }
 if(window.jQuery){window.jQuery(document).on('forminator:form:submit:success',function(e){if(e.target===form||window.jQuery(form).is(e.target)||window.jQuery(e.target).closest(form).length)done()});
  window.jQuery(document).on('forminator:form:submit:failed',function(e){if(e.target===form||window.jQuery(form).is(e.target))pending=null})}
 try{new MutationObserver(function(){if(pending&&form.querySelector('.forminator-response-message.forminator-success,.forminator-success'))done()}).observe(form,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})}catch(e){}
}
/* any link to #enquiry on the site opens the footer form */
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href="#enquiry"],a[href$="#enquiry"],[data-open-enquiry]');if(a&&!pageHasOwnForm()&&ffForm()){e.preventDefault();openEnquiry(a.getAttribute('data-open-enquiry')||'link')}});

/* ---------- cookies: use the site's tool if there is one, otherwise a minimal Consent Mode v2 banner ---------- */
function store(v){try{if(v===undefined)return localStorage.getItem('tf_consent');localStorage.setItem('tf_consent',v)}catch(e){return null}}
function pageBanner(){return document.querySelector('#tf5-cookie,#tf3-cookie,[id$="-cookie"][role=dialog]:not(#tflf-ck)')}
function otherTool(){return !!(window.Cookiebot||window.CookieYes||window.revisitCkyConsent||window.cmplz_show_banner||window.complianz||window.OneTrust||window.Osano||window.__tcfapi||document.querySelector('#cmplz-cookiebanner-container,.cky-consent-container,#CybotCookiebotDialog,#onetrust-banner-sdk,.cmplz-cookiebanner,#moove_gdpr_cookie_info_bar,#cookie-law-info-bar'))}
function decide(g){var v=g?'granted':'denied';gtag('consent','update',{ad_storage:v,analytics_storage:v,ad_user_data:v,ad_personalization:v});store(v);ckb.hidden=true;window.dataLayer.push({event:'thefaces_cookie_choice',choice:v})}
ckb.addEventListener('click',function(e){if(e.target.closest('.y'))decide(true);else if(e.target.closest('.n'))decide(false);else{var a=e.target.closest('[data-sec]');if(a){e.preventDefault();show(3)}}});
function cookieSettings(){
 try{if(window.Cookiebot&&Cookiebot.renew){Cookiebot.renew();return}}catch(e){}
 try{if(window.revisitCkyConsent){revisitCkyConsent();return}}catch(e){}
 try{if(window.OneTrust&&OneTrust.ToggleInfoDisplay){OneTrust.ToggleInfoDisplay();return}}catch(e){}
 try{if(window.cmplz_show_banner){cmplz_show_banner();return}}catch(e){}
 var pb=pageBanner();if(pb){pb.hidden=false;return}
 ckb.hidden=false;}
function mount(){document.body.appendChild(f);document.body.appendChild(ckb);render();
 if(!pageHasOwnForm()){var fm=ffForm();if(fm)wire(fm);if(/#enquiry$/.test(location.hash))setTimeout(function(){openEnquiry('url')},400)}
 var last=lang();new MutationObserver(function(){if(lang()!==last){last=lang();render()}}).observe(document.documentElement,{attributes:true,attributeFilter:['lang'],subtree:true});
 setTimeout(function(){var c=store();
  if(c==='granted'||c==='denied'){if(c==='granted')gtag('consent','update',{ad_storage:'granted',analytics_storage:'granted',ad_user_data:'granted',ad_personalization:'granted'});return}
  if(CONFIG.ownBanner&&!otherTool()&&!pageBanner()){gtag('consent','default',{ad_storage:'denied',analytics_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',wait_for_update:500});ckb.hidden=false}
 },600);}
if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount);
})();
</script>
