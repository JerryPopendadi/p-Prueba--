<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
(function(){
  var denied=false;try{denied=localStorage.getItem('tf_consent')==='denied'}catch(e){}
  if(denied){fbq('consent','revoke')}
  fbq('init','1498073385536700');

  /* Lead: one per Forminator submission (form 703 and any other Forminator form) */

  function hook(){if(window.jQuery){window.jQuery(document).on('forminator:form:submit:success',lead);return true}return false}

    else if(/wa\.me|whatsapp\.com/i.test(h)){fbq('track','Contact',{content_name:'whatsapp'})}
    else if(/^tel:/i.test(h)){fbq('track','Contact',{content_name:'phone'})}

  /* Cookie banner: "Reject" stops sending, "Accept" allows it again */
