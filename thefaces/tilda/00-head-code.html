<!-- THE FACES · Tilda: Site settings → More → HTML code for the HEAD section
     1) Google Consent Mode v2: everything denied until the visitor accepts (Indonesian PDP law 27/2022 + GDPR for EU guests).
     2) Google Tag Manager: replace GTM-XXXXXXX with the real container ID.
     3) Montserrat (same font as thefacespeace.com). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied',
    analytics_storage: 'denied', wait_for_update: 500
  });
  // Call tfConsent(true) from the cookie banner "Accept" button, tfConsent(false) from "Reject".
  window.tfConsent = function (ok) {
    var v = ok ? 'granted' : 'denied';
    gtag('consent', 'update', {ad_storage: v, ad_user_data: v, ad_personalization: v, analytics_storage: v});
    try { localStorage.setItem('tf_consent', v); } catch (e) {}
  };
  try { var c = localStorage.getItem('tf_consent'); if (c) window.tfConsent(c === 'granted'); } catch (e) {}
</script>
