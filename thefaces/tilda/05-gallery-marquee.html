<!-- THE FACES · "The space" gallery in motion (two rows sliding in opposite directions).
     Paste into a Tilda T123 block. Replace the image URLs with the ones Tilda gives you after
     uploading the photos (Site settings → Upload files, or any Tilda image block → copy link). -->
<style>
#tf-gal{background:#f4f3ef;overflow:hidden;padding:clamp(70px,9vw,130px) 0;font-family:Montserrat,Arial,sans-serif}
#tf-gal .hd{max-width:1320px;margin:0 auto 44px;padding:0 clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
#tf-gal .ey{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#0a0a0a}
#tf-gal h2{font-weight:200;font-size:clamp(34px,4.6vw,68px);line-height:1.08;margin:16px 0 0;color:#0a0a0a}
#tf-gal .ig{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;border-bottom:1px solid;padding-bottom:6px;color:#0a0a0a;text-decoration:none}
#tf-gal .row{display:flex;gap:18px;width:max-content;animation:tfmq 60s linear infinite}
#tf-gal .row.rev{animation-direction:reverse;animation-duration:70s;margin-top:18px}
#tf-gal .row img{height:clamp(220px,28vw,380px);width:auto;aspect-ratio:2/3;object-fit:cover;filter:grayscale(.35);transition:filter .6s}
#tf-gal .row img:hover{filter:none}
#tf-gal:hover .row{animation-play-state:paused}
@keyframes tfmq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){#tf-gal .row{animation:none}}
</style>
<section id="tf-gal" aria-label="Inside The Faces">
  <div class="hd">
    <div><p class="ey">Inside</p><h2>The space.</h2></div>
    <a class="ig" href="https://www.instagram.com/thefacesbali" target="_blank" rel="noopener">Instagram @thefacesbali ↗</a>
  </div>
  <div class="row" data-row="1"></div>
  <div class="row rev" data-row="2"></div>
</section>
<script>
(function(){
  var row1 = [ /* first row: paste image URLs */
    'https://thefaces.pages.dev/img/g01-face.webp','https://thefaces.pages.dev/img/g04-interior.webp',
    'https://thefaces.pages.dev/img/g09-proc-s.webp','https://thefaces.pages.dev/img/g02-face-s.webp',
    'https://thefaces.pages.dev/img/g08-interior.webp','https://thefaces.pages.dev/img/g12-proc-s.webp'];
  var row2 = [ /* second row */
    'https://thefaces.pages.dev/img/g06-interior.webp','https://thefaces.pages.dev/img/g10-proc-s.webp',
    'https://thefaces.pages.dev/img/g03-face-s.webp','https://thefaces.pages.dev/img/g05-interior-s.webp',
    'https://thefaces.pages.dev/img/g11-proc-s.webp','https://thefaces.pages.dev/img/g07-interior-s.webp'];
  function fill(sel, list){
    var html = list.concat(list).map(function(u){return '<img src="'+u+'" alt="The Faces spa, Bali" loading="lazy">';}).join('');
    document.querySelector('#tf-gal [data-row="'+sel+'"]').innerHTML = html;
  }
  fill(1,row1); fill(2,row2);
})();
</script>
