   <p class="eyebrow rv"><span class="n">01 —</span>哲学</p>
   <h2 class="h2 rv d1">美しさは、内なる調和から始まる。</h2>
   <p class="lead rv d2">The Facesは、それぞれの元素があなたの中で目覚める、愛の空間です。美しさとは外見だけではなく、自分自身と世界との深いつながりです。</p>
   <p class="muted rv d3">静けさ、温度、光、質感、香り、そしてセラピストの動き。そのすべてがひとつの儀式になります。訪れるたびに、最初のタッチのずっと前から体験は始まっています。</p>
   <p class="sign rv d4">アンナ＆エフゲニー・ドゥビニン · 創業者</p>
