<!doctype html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lera · Панель</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4EF;--w:#fff;--ink:#141A14;--ink2:#3C463B;--muted:#6E776C;--line:#E2E5DC;--sage:#DCE4D2;--moss:#2F3D2C;--sky:#DCE7EC;--rose:#EFE5DF;--red:#B4553A;
--h:'Inter Tight',Inter,system-ui,-apple-system,Arial,sans-serif;--s:Inter,system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--s);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{padding:calc(20px + env(safe-area-inset-top)) 18px 6px;max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-family:var(--h);font-weight:600;font-size:28px;letter-spacing:-.035em;line-height:1}
.top .d{color:var(--muted);font-size:13.5px;margin-top:4px}
.top .refresh{background:var(--w);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:8px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
.kpi{background:var(--w);border-radius:20px;padding:16px}
.kpi b{display:block;font-family:var(--h);font-weight:600;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.g{background:var(--moss);color:#fff}.kpi.g span{color:#C9D1C4}
h2{font-family:var(--h);font-weight:600;font-size:20px;letter-spacing:-.02em;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2 small{font-family:var(--s);font-size:13px;font-weight:400;color:var(--muted)}
.item{background:var(--w);border-radius:20px;padding:16px 18px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .t{font-weight:600;font-size:15.5px}
.item .m{color:var(--muted);font-size:13.5px;margin-top:2px}
.time{font-family:var(--h);font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:58px;line-height:1.1}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.pill.new{background:var(--rose);color:#8A4B33}
.pill.paid{background:var(--sage);color:var(--moss)}
.pill.warn{background:#F6E2DA;color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{border:0;background:var(--bg);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.b.gold{background:var(--ink);color:#fff}
.b.ok{background:var(--sage);color:var(--moss)}
.b.no{color:var(--red)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.empty{color:var(--muted);font-size:14px;padding:16px 4px}
.alert{background:var(--sage)}
.tip{background:var(--sky);font-size:14px}
.tip a{color:var(--ink);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 8px;position:relative}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--ink)}
.tabs .dot{position:absolute;top:0;right:4px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.view{display:none}.view.on{display:block}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 12px 30px -10px rgba(20,26,20,.5);cursor:pointer;z-index:6}
.sheet{position:fixed;inset:0;background:rgba(20,26,20,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .in{background:var(--w);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--h);font-weight:600;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .w{grid-column:span 2}
label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;background:var(--bg);border:1px solid transparent;border-radius:14px;padding:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink);background:#fff}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:20;display:none}
.search{width:100%;margin:4px 0 12px;background:var(--w)}
.seg{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding-bottom:2px}
.seg button{background:var(--w);border:0;border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
details.more{margin-top:8px;font-size:13.5px;color:var(--ink2)}
details.more summary{cursor:pointer;color:var(--moss);font-weight:500}
.chatrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--w);border:0;border-radius:20px;padding:14px 16px;margin-bottom:8px;text-align:left;cursor:pointer}
.ava{width:44px;height:44px;border-radius:50%;background:var(--sage);color:var(--moss);display:flex;align-items:center;justify-content:center;font-family:var(--h);font-weight:600;flex:none}
.cr{flex:1;min-width:0}.cr b{display:block}.cr small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}.cm small{color:var(--muted);font-size:12px}
.cm i{font-style:normal;background:var(--ink);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px}
#sThread .in{height:92vh;display:flex;flex-direction:column;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.thhead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.thhead .x{margin-left:auto;background:var(--bg);border:0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
#thBody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:14px 2px}
.bub{max-width:80%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bub.her{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.bub small{display:block;font-size:11px;opacity:.6;margin-top:2px}
.day{align-self:center;font-size:12px;color:var(--muted);margin:8px 0 2px}
.thin{display:flex;gap:8px;align-items:flex-end;padding-top:10px}
.thin textarea{min-height:46px;max-height:130px;resize:none;border-radius:23px}
.send{width:46px;height:46px;border-radius:50%;background:var(--ink);border:0;color:#fff;cursor:pointer;flex:none;font-size:18px}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}.fg .w{grid-column:auto}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top">
  <div><h1>Привет, Лера 🌿</h1><div class="d" id="today"></div></div>
  <button class="refresh" onclick="load()">↻ Обновить</button>
</div>
<main>
  <div class="kpis">
    <div class="kpi g"><b id="kMonth">—</b><span>Доход за месяц</span></div>
    <div class="kpi"><b id="kToday">—</b><span>Занятий сегодня</span></div>
    <div class="kpi"><b id="kLeads">—</b><span>Новых заявок</span></div>
    <div class="kpi"><b id="kClients">—</b><span>Активных клиенток</span></div>
  </div>
  <section class="view on" id="v-home">
    <div id="alerts"></div>
    <h2>Сегодня <small id="todayCount"></small></h2><div id="todayList"></div>
    <h2>Дальше</h2><div id="nextList"></div>
  </section>
  <section class="view" id="v-chats"><h2>Чаты</h2><div id="chatList"></div></section>
  <section class="view" id="v-leads"><h2>Заявки</h2><div class="seg" id="leadSeg"></div><div id="leadList"></div></section>
  <section class="view" id="v-clients">
    <h2>Клиентки</h2>
    <input class="search" id="cSearch" placeholder="Поиск по имени или email" oninput="renderClients()">
    <div id="clientList"></div>
    <h2>Группы</h2><div id="groupList"></div>
  </section>
  <section class="view" id="v-money"><h2>Оплаты <small id="mSum"></small></h2><div id="payList"></div></section>
</main>

<button class="fab" id="fab" onclick="openSession()">＋ Занятие</button>

<nav class="tabs">
  <button class="on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Сегодня</button>
  <button data-v="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>Чаты<span class="dot" id="chatDot" hidden></span></button>
  <button data-v="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Заявки<span class="dot" id="leadDot" hidden></span></button>
  <button data-v="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 2 6 5.5"/></svg>Клиентки</button>
  <button data-v="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M17 7H9.5a3 3 0 000 6h5a3 3 0 010 6H6"/></svg>Деньги</button>
</nav>

<div class="sheet" id="sSession"><div class="in">
  <h3>Новое занятие</h3>
  <div class="fg">
    <div class="w"><label>Клиентка</label><select id="sClient"></select></div>
    <div><label>Дата</label><input type="date" id="sDate"></div>
    <div><label>Время (по Бали)</label><input type="time" id="sTime" value="09:00"></div>
    <div><label>Минут</label><input type="number" id="sMin" value="60" min="15" max="240"></div>
    <div><label>Тип</label><select id="sType"><option>Тренировка</option><option>Чек-ин</option><option>Консультация по питанию</option><option>Созвон</option></select></div>
    <div class="w"><label>Заметка</label><input id="sNotes" placeholder="например: ягодицы + кор"></div>
  </div>
  <p style="color:var(--muted);font-size:13px;margin-top:10px">Клиентке придёт приглашение в календарь с Zoom и напоминаниями, а занятие появится в её приложении.</p>
  <div class="acts"><button class="b gold" onclick="saveSession()">Сохранить</button><button class="b" onclick="closeSheets()">Отмена</button></div>
</div></div>

<div class="sheet" id="sPay"><div class="in">
  <h3>Оплата вручную</h3>
  <div class="fg">
    <div class="w"><label>Имя</label><input id="pName"></div>
    <div class="w"><label>Email</label><input id="pEmail" type="email"></div>
    <div class="w"><label>За что</label><input id="pProduct" placeholder="Пакет 8 тренировок"></div>
    <div><label>Сумма</label><input id="pAmount" type="number" min="1" step="0.01"></div>
    <div><label>Валюта</label><select id="pCur"><option>USD</option><option>USDT</option><option>EUR</option><option>IDR</option></select></div>
  </div>
  <div class="acts"><button class="b gold" onclick="savePay()">Сохранить</button><button class="b" onclick="closeSheets()">Отмена</button></div>
</div></div>

<div class="sheet" id="sThread"><div class="in">
  <div class="thhead"><span class="ava" id="thAva">💬</span><div><b id="thName"></b><div style="color:var(--muted);font-size:13px" id="thSub"></div></div><button class="x" onclick="closeThread()">×</button></div>
  <div id="thBody"></div>
  <div class="thin"><textarea id="thInput" rows="1" placeholder="Сообщение…"></textarea><button class="send" onclick="sendThread()">➤</button></div>
</div></div>

<script>
var D = null, leadFilter = 'Активные';
var STAT = ['Новая','Связаться','Оплачено','В работе','Лист ожидания','Отказ','Архив'];
function call(fn, args, ok) {
  if (window.google && google.script && google.script.run) {
    var r = google.script.run.withSuccessHandler(ok || function(){}).withFailureHandler(function(e){ toast('Ошибка: ' + (e && e.message || e)); });
    r[fn].apply(r, args || []);
  } else {
    if (fn === 'getDashboard') return ok(demo());
    if (fn === 'getThread' || fn === 'sendMessage') return ok(demoThread(args[0], fn==='sendMessage'?args[1]:null));
    toast('Демо: ' + fn); ok && ok(true);
  }
}
function load(){ call('getDashboard', [], function(d){ D = d; render(); }); }
/* ---------- рендер ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function money(n){ return '$' + Number(n||0).toLocaleString('en-US'); }
function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso.slice(0,10)+'T00:00:00'); return d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}); }
function wa(phone){ var p=String(phone||'').replace(/[^\d]/g,''); return p ? 'https://wa.me/'+p : ''; }

function render(){
  document.getElementById('today').textContent = fmtDate(D.today) + ' · ' + D.tz;
  kMonth.textContent = money(D.kpi.month); kToday.textContent = D.kpi.todaySessions; kLeads.textContent = D.kpi.newLeads; kClients.textContent = D.kpi.activeClients;
  var dot = document.getElementById('leadDot'); dot.hidden = !D.kpi.newLeads; dot.textContent = D.kpi.newLeads;
  var unread=(D.chats||[]).reduce(function(a,c){return a+c.unread},0); var cd=document.getElementById('chatDot'); cd.hidden=!unread; cd.textContent=unread;
  renderHome(); renderChats(); renderLeads(); renderClients(); renderGroups(); renderMoney();
}

function sessionCard(s){
  return '<div class="item"><div class="row"><div style="display:flex;gap:14px"><div class="time">'+esc(s.time)+'</div><div><div class="t">'+esc(s.name||s.email)+'</div>'+
    '<div class="m">'+esc(s.type)+' · '+s.min+' мин'+(s.notes?' · '+esc(s.notes):'')+'</div></div></div>'+
    '<span class="pill '+(s.status==='Запланировано'?'new':s.status==='Проведено'?'paid':'warn')+'">'+esc(s.status)+'</span></div>'+
    (s.status==='Запланировано' ? '<div class="acts"><button class="b ok" onclick="sStatus(\''+s.id+'\',\'Проведено\')">✓ Проведено</button>'+
      '<button class="b" onclick="sStatus(\''+s.id+'\',\'Неявка\')">Неявка</button><button class="b no" onclick="sStatus(\''+s.id+'\',\'Отменено\')">Отменить</button>'+
      (s.link?'<a class="b" href="'+esc(s.link)+'" target="_blank">Zoom</a>':'')+'</div>' : '')+'</div>';
}
function renderHome(){
  var today = D.sessions.filter(function(s){return s.date===D.today && s.status==='Запланировано'});
  var next = D.sessions.filter(function(s){return s.date>D.today && s.status==='Запланировано'}).slice(0,12);
  todayCount.textContent = today.length ? today.length + ' шт.' : '';
  todayList.innerHTML = today.length ? today.map(sessionCard).join('') : '<div class="empty">Сегодня занятий нет 🌿</div>';
  var byDay = {}; next.forEach(function(s){ (byDay[s.date]=byDay[s.date]||[]).push(s) });
  nextList.innerHTML = next.length ? Object.keys(byDay).map(function(d){ return '<div class="m" style="margin:12px 4px 6px;color:var(--muted)">'+fmtDate(d)+'</div>'+byDay[d].map(sessionCard).join(''); }).join('') : '<div class="empty">Пока ничего не запланировано</div>';
  var a = [];
  var unreadC=(D.chats||[]).filter(function(c){return c.unread});
  if (unreadC.length) a.push('<div class="item alert"><div class="t">💬 Непрочитанные сообщения: '+unreadC.reduce(function(x,c){return x+c.unread},0)+'</div><div class="m">'+unreadC.map(function(c){return esc(c.name)}).join(', ')+'</div><div class="acts"><button class="b gold" onclick="tab(\'chats\')">Открыть чаты</button></div></div>');
  var newL = D.leads.filter(function(l){return l.status==='Новая'});
  if (newL.length) a.push('<div class="item alert"><div class="t">📩 '+newL.length+' новых заявок</div><div class="m">Ответь в течение 24 часов — так обещано на сайте.</div><div class="acts"><button class="b gold" onclick="tab(\'leads\')">Открыть заявки</button></div></div>');
  var uns = D.clients.filter(function(c){ return c.status==='Активен' && !c.group && !D.sessions.some(function(s){return s.email===c.email && s.status==='Запланировано'}) });
  if (uns.length) a.push('<div class="item alert"><div class="t">🗓 Оплатили, но нет занятий: '+uns.length+'</div><div class="m">'+uns.map(function(c){return esc(c.name)}).join(', ')+'</div><div class="acts"><button class="b gold" onclick="openSession(\''+esc(uns[0].email)+'\')">Поставить занятие</button></div></div>');
  var low = D.clients.filter(function(c){return c.status==='Активен' && c.left<=1});
  if (low.length) a.push('<div class="item alert"><div class="t">🔁 Заканчивается пакет: '+low.length+'</div><div class="m">'+low.map(function(c){return esc(c.name)+' ('+c.left+')'}).join(', ')+' — предложи продление.</div></div>');
  alerts.innerHTML = a.join('');
}

function renderLeads(){
  var groups = {'Активные':function(l){return ['Новая','Связаться','Оплачено','Лист ожидания'].indexOf(l.status)>-1}, 'Все':function(){return true}};
  STAT.forEach(function(s){ groups[s]=function(l){return l.status===s} });
  leadSeg.innerHTML = Object.keys(groups).map(function(k){ var n=D.leads.filter(groups[k]).length; return '<button class="'+(k===leadFilter?'on':'')+'" onclick="leadFilter=\''+k+'\';renderLeads()">'+k+' '+n+'</button>' }).join('');
  var list = D.leads.filter(groups[leadFilter]);
  leadList.innerHTML = list.length ? list.map(function(l){
    var cls = l.status==='Новая'?'new':l.status==='Оплачено'||l.status==='В работе'?'paid':'';
    return '<div class="item"><div class="row"><div><div class="t">'+esc(l.name)+'</div><div class="m">'+esc(l.program)+(l.group?' · '+esc(l.group):'')+' · '+money(l.price)+'</div>'+
      '<div class="m">'+fmtDate(l.date)+' · '+esc(l.goal)+' · '+esc(l.level)+'</div></div><span class="pill '+cls+'">'+esc(l.status)+'</span></div>'+
      '<details class="more"><summary>Подробнее</summary><div style="margin-top:6px">📧 '+esc(l.email)+'<br>📱 '+esc(l.phone)+(l.ig?'<br>📷 '+esc(l.ig):'')+
      (l.days?'<br>Дни: '+esc(l.days):'')+(l.times?' · Время: '+esc(l.times):'')+'<br>Пояс клиента: '+esc(l.tz)+' · Язык: '+esc(l.lang)+
      (l.notes?'<br>Заметки: '+esc(l.notes):'')+(l.paid?'<br>Оплачено: '+esc(l.paid):'')+'</div></details>'+
      '<div class="acts">'+(wa(l.phone)?'<a class="b" target="_blank" href="'+wa(l.phone)+'">WhatsApp</a>':'')+'<a class="b" href="mailto:'+esc(l.email)+'">Email</a>'+
      '<select class="b" style="width:auto" onchange="lStatus(\''+l.id+'\',this.value)">'+STAT.map(function(s){return '<option'+(s===l.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
      (['Новая','Связаться','Лист ожидания'].indexOf(l.status)>-1?'<button class="b ok" onclick="activate(\''+l.id+'\')">Сделать клиентом</button>':'')+'</div></div>';
  }).join('') : '<div class="empty">Нет заявок в этом списке</div>';
}

function renderClients(){
  var q = (cSearch.value||'').toLowerCase();
  var list = D.clients.filter(function(c){ return !q || (c.name+' '+c.email).toLowerCase().indexOf(q)>-1 })
    .sort(function(a,b){ return (a.status==='Активен'?0:1)-(b.status==='Активен'?0:1) || a.left-b.left });
  clientList.innerHTML = list.length ? list.map(function(c){
    var pct = c.total ? Math.round(c.done/c.total*100) : 0;
    return '<div class="item"><div class="row"><div><div class="t">'+esc(c.name)+'</div><div class="m">'+esc(c.program)+(c.group?' · '+esc(c.group):'')+'</div></div>'+
      '<span class="pill '+(c.status==='Активен'?(c.left<=1?'warn':'paid'):'')+'">'+(c.status==='Активен'?'осталось '+c.left:esc(c.status))+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="m" style="margin-top:6px">Проведено '+c.done+' из '+c.total+'</div>'+
      '<div class="acts"><button class="b gold" onclick="openSession(\''+esc(c.email)+'\')">＋ Занятие</button><button class="b" onclick="openThread(\''+esc(c.email)+'\')">💬 Чат</button>'+(wa(c.phone)?'<a class="b" target="_blank" href="'+wa(c.phone)+'">WhatsApp</a>':'')+'<a class="b" href="mailto:'+esc(c.email)+'">Email</a></div></div>';
  }).join('') : '<div class="empty">Клиентов пока нет — они появятся сами после первой оплаты</div>';
}

function renderGroups(){
  groupList.innerHTML = D.groups.map(function(g){
    var pct = g.cap ? Math.round(g.taken/g.cap*100) : 0;
    var members = D.clients.filter(function(c){return c.group===g.id && c.status==='Активен'});
    return '<div class="item"><div class="row"><div><div class="t">'+esc(g.name)+' · '+esc(g.time)+'</div><div class="m">'+esc(g.days)+(g.start?' · старт '+fmtDate(g.start):'')+'</div></div>'+
      '<span class="pill '+(g.taken>=g.cap?'warn':'paid')+'">'+g.taken+' / '+g.cap+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="m" style="margin-top:8px">'+(members.length?members.map(function(c){return esc(c.name)}).join(', '):'Пока никого')+'</div>'+
      '<div class="acts"><input type="date" id="gs-'+g.id+'" style="width:auto"><button class="b gold" onclick="series(\''+g.id+'\')">Создать занятия в календаре</button></div></div>';
  }).join('');
}

function renderMoney(){
  var m = D.today.slice(0,7), sum = D.payments.filter(function(p){return p.date.slice(0,7)===m}).reduce(function(s,p){return s+p.amount},0);
  mSum.innerHTML = 'за месяц <b style="color:var(--ink)">'+money(Math.round(sum))+'</b> · <a href="#" style="color:var(--moss)" onclick="openPay();return false">＋ вручную</a>';
  payList.innerHTML = D.payments.length ? D.payments.map(function(p){
    return '<div class="item"><div class="row"><div><div class="t">'+esc(p.name||p.email)+'</div><div class="m">'+esc(p.product)+' · '+esc(p.source)+' · '+fmtDate(p.date)+'</div></div>'+
      '<div class="time" style="font-size:20px">'+(p.currency==='USD'?'$':'')+Number(p.amount).toLocaleString('en-US')+(p.currency!=='USD'?' '+esc(p.currency):'')+'</div></div></div>';
  }).join('') : '<div class="empty">Оплат пока нет</div>';
}

/* ---------- действия ---------- */
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(function(){el.style.display='none'},2600); }
function tab(v){ document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v)}); document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)}); scrollTo(0,0); }
document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){tab(b.dataset.v)} });
function closeSheets(){ document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('on')}); }
document.querySelectorAll('.sheet').forEach(function(s){ s.addEventListener('click',function(e){ if(e.target===s){ if(s.id==='sThread') closeThread(); else closeSheets(); } }) });

function sStatus(id, st){ if(st==='Отменено' && !confirm('Отменить занятие и удалить из календаря?')) return; call('setSessionStatus',[id,st],function(){ toast('Готово: '+st); load(); }); }
function lStatus(id, st){ call('setLeadStatus',[id,st,null],function(){ toast('Статус: '+st); load(); }); }
function activate(id){ call('activateLead',[id],function(){ toast('Клиент добавлен'); load(); }); }
function series(gid){ var d=document.getElementById('gs-'+gid).value; if(!d) return toast('Выбери дату старта (понедельник)'); call('createGroupSeries',[gid,d],function(n){ toast('Создано. Приглашено: '+n); load(); }); }

function openSession(email){
  var opts = D.clients.filter(function(c){return c.status==='Активен'}).map(function(c){ return '<option value="'+esc(c.email)+'"'+(c.email===email?' selected':'')+'>'+esc(c.name)+' · осталось '+c.left+'</option>'; });
  sClient.innerHTML = '<option value="">— без клиента (личное) —</option>' + opts.join('');
  sDate.value = D.today; document.getElementById('sSession').classList.add('on');
}
function saveSession(){
  var o = { email:sClient.value, date:sDate.value, time:sTime.value, min:sMin.value, type:sType.value, notes:sNotes.value };
  if(!o.date||!o.time) return toast('Укажи дату и время');
  call('addSession',[o],function(){ closeSheets(); sNotes.value=''; toast('Занятие добавлено, приглашение отправлено'); load(); });
}
function openPay(){ document.getElementById('sPay').classList.add('on'); }
function savePay(){
  var o = { name:pName.value, email:pEmail.value, product:pProduct.value, amount:pAmount.value, currency:pCur.value };
  if(!(+o.amount>0)) return toast('Укажи сумму');
  call('addPayment',[o],function(){ closeSheets(); toast('Оплата добавлена'); load(); });
}


/* ---------- чаты ---------- */
var curThread=null, threadPoll=null;
function ago(iso){ if(!iso) return ''; var d=new Date(iso), n=new Date(); return d.toDateString()===n.toDateString() ? d.toTimeString().slice(0,5) : d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function initials(n){ return String(n||'?').trim().split(/\s+/).map(function(x){return x[0]}).slice(0,2).join('').toUpperCase(); }
function renderChats(){
  var list=D.chats||[];
  chatList.innerHTML = (D.appUrl?'<div class="item tip">Приложение клиенток: <a href="'+esc(D.appUrl)+'" target="_blank">открыть</a> · отправь ссылку клиентке после оплаты</div>':'')+
   (list.length ? list.map(function(c){
    return '<button class="chatrow" onclick="openThread(\''+esc(c.email)+'\')"><span class="ava">'+esc(initials(c.name))+'</span><span class="cr"><b>'+esc(c.name)+'</b><small>'+(c.lastFrom==='lera'?'Ты: ':'')+esc(c.last)+'</small></span><span class="cm"><small>'+ago(c.at)+'</small>'+(c.unread?'<i>'+c.unread+'</i>':'')+'</span></button>';
  }).join('') : '<div class="empty">Сообщений пока нет. Клиентки пишут из своего приложения.</div>');
}
function openThread(email){
  curThread=email; var c=(D.clients||[]).filter(function(x){return x.email===email})[0]||(D.chats||[]).filter(function(x){return x.email===email})[0]||{name:email};
  thName.textContent=c.name||email; thSub.textContent=(c.program||'')+(c.left!=null?' · осталось '+c.left:'');
  thBody.innerHTML='<div class="empty">…</div>'; document.getElementById('sThread').classList.add('on');
  call('getThread',[email],drawThread);
  clearInterval(threadPoll); threadPoll=setInterval(function(){ if(curThread) call('getThread',[curThread],drawThread); },8000);
}
function drawThread(msgs){
  if(!Array.isArray(msgs)) msgs=[];
  var last=''; thBody.innerHTML = msgs.length ? msgs.map(function(m){ var d=new Date(m.at), day=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}), h='';
    if(day!==last){ h+='<div class="day">'+day+'</div>'; last=day; }
    return h+'<div class="bub '+(m.from==='lera'?'me':'her')+'">'+esc(m.text)+'<small>'+d.toTimeString().slice(0,5)+'</small></div>'; }).join('') : '<div class="empty">Напиши первой 🌿</div>';
  thBody.scrollTop=thBody.scrollHeight;
}
function sendThread(){
  var v=thInput.value.trim(); if(!v||!curThread) return; thInput.value='';
  call('sendMessage',[curThread,v],function(msgs){ drawThread(msgs); load(); });
}
function closeThread(){ curThread=null; clearInterval(threadPoll); closeSheets(); load(); }
